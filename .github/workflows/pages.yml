name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run one deploy at a time; a running deploy is never cancelled mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and publish run as separate jobs (GitHub's own Pages template does
  # this). In one job, deploy-pages sometimes looked up the artifact before it
  # was visible and failed with "No artifacts named github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the site files, not the README or workflow config.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css app.js assets .nojekyll _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
